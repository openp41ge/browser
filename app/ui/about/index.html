<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>About openp41ge explorer</title>
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="about.css" />
  </head>
  <body>
    <main>
      <h1>
        <picture>
          <source media="(prefers-color-scheme: dark)" srcset="wordmark-dark.svg" />
          <img src="wordmark-light.svg" alt="openp41ge browser" height="40" />
        </picture>
      </h1>
      <p class="name">openp41ge explorer</p>
      <dl class="versions">
        <dt>Version</dt>
        <dd id="version"></dd>
        <dt>Engine</dt>
        <dd id="engine"></dd>
      </dl>
      <p class="links">
        <a href="https://github.com/openp41ge/browser">Source code</a>
        <a href="https://github.com/openp41ge/browser/blob/master/LICENSE">License</a>
        <a href="https://github.com/openp41ge/browser/releases">Releases</a>
      </p>
    </main>
    <script type="module" src="about.js"></script>
  </body>
</html>
