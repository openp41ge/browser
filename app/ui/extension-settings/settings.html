<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Settings</title>
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="settings.css">
<header>
  <h1 id="title">Settings</h1>
  <p id="version"></p>
</header>
<section id="problems" hidden>
  <ul id="missing"></ul>
  <ul id="ignored"></ul>
</section>
<section id="secrets" hidden>
  <h2>Secrets</h2>
  <p class="hint">Kept in your Keychain, not in the settings file, and never given to the extension's scripts in web pages.</p>
  <ul id="secret-list"></ul>
</section>
<main id="editor-area">
  <p id="note" hidden></p>
</main>
<footer id="bar" hidden>
  <button id="save" type="button" disabled>Save</button>
  <button id="revert" type="button" disabled>Revert</button>
  <p id="status" role="status"></p>
  <label class="toggle" id="show-defaults-toggle" hidden><input id="show-defaults" type="checkbox"> Show default values</label>
  <label class="toggle"><input id="json-view" type="checkbox"> JSON view</label>
</footer>
<script type="module" src="settings.js"></script>
