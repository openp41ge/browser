<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab bar</title>
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="tabbar.css" />
  </head>
  <body>
    <div class="bar">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="fade left"></div>
      <div class="fade right"></div>
      <div class="filter" id="filter">
        <input class="query" id="query" type="text" placeholder="Filter tabs" spellcheck="false" autocomplete="off" aria-label="Filter tabs" tabindex="-1" />
        <button class="find" id="find" title="Filter Tabs" aria-label="Filter Tabs">
          <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" /></svg>
        </button>
      </div>
      <button class="add" id="add" title="New Tab" aria-label="New Tab">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
      </button>
    </div>
    <script type="module" src="tabbar.js"></script>
  </body>
</html>
