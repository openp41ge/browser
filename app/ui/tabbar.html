<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab bar</title>
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="tabbar.css" />
  </head>
  <body>
    <div class="bar">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="fade left"></div>
      <div class="fade right"></div>
      <div class="filter" id="filter">
        <button class="find" id="find" title="Filter Tabs" aria-label="Filter Tabs">
          <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-160q-17 0-28.5-11.5T400-200v-240L168-736q-15-20-4.5-42t36.5-22h560q26 0 36.5 22t-4.5 42L560-440v240q0 17-11.5 28.5T520-160h-80Zm40-308 198-252H282l198 252Zm0 0Z" /></svg>
        </button>
        <input class="query" id="query" type="text" placeholder="Filter tabs" spellcheck="false" autocomplete="off" aria-label="Filter tabs" tabindex="-1" />
      </div>
      <button class="add" id="add" title="New Tab" aria-label="New Tab">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
      </button>
    </div>
    <script type="module" src="tabbar.js"></script>
  </body>
</html>
