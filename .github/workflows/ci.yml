# Builds openp41ge explorer on every push and pull request. The tests
# (the private browser-tests repo) are run by hand; see PLAN.md, "Tests".
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v7

      - name: Cache CEF
        uses: actions/cache@v6
        with:
          path: third_party/cef
          key: cef-macosarm64-${{ hashFiles('CEF_VERSION') }}

      - name: Fetch CEF and Sparkle
        run: |
          scripts/fetch-cef
          scripts/fetch-sparkle

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        # A release build: what's published (its own profile folder).
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXPLORER_CHANNEL=release

      - name: Build
        run: cmake --build build

      # ditto keeps the framework's symlinks intact.
      - name: Package
        run: |
          cd build/app/Release
          ditto -c -k --keepParent "openp41ge explorer.app" "$GITHUB_WORKSPACE/openp41ge-explorer-macos-arm64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: openp41ge-explorer-macos-arm64
          path: openp41ge-explorer-macos-arm64.zip
          retention-days: 7

